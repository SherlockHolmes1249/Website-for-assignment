<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduSubmit — Assignment Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000000; --surface: #1a1a1a; --surface2: #222222; --surface3: #2d2d2d;
      --border: #333333; --border-hover: #444444; --text: #ffffff; --muted: #999999;
      --accent: #FF6719; --accent-hover: #e55a12;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
      --font-serif: 'Lora', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    
    /* NAV */
    nav { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 2rem; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: var(--font-serif); font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; }
    .btn-admin { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .btn-admin:hover { border-color: var(--muted); }
    
    /* HERO */
    .hero { text-align: center; padding: 5rem 2rem 3rem; max-width: 800px; margin: 0 auto; }
    .hero h1 { font-family: var(--font-serif); font-size: clamp(2.5rem, 6vw, 3.5rem); font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 1rem; color: var(--text); }
    .hero p { color: var(--muted); font-size: 1.125rem; max-width: 500px; margin: 0 auto; line-height: 1.6; }
    
    /* STATS */
    .stats-bar { display: flex; gap: 1rem; padding: 0 2rem; max-width: 1040px; margin: 0 auto 4rem; }
    .stat { flex: 1; padding: 1.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text); line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    
    /* SECTION */
    .section { max-width: 1040px; margin: 0 auto; padding: 0 2rem 5rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .section-title { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 500; }
    .filter-tabs { display: flex; gap: 1rem; }
    .tab { font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--muted); transition: 0.2s; padding: 0.25rem 0; }
    .tab.active { color: var(--text); border-bottom: 2px solid var(--text); }
    .tab:hover:not(.active) { color: var(--text); }
    
    /* CARDS */
    #assignments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; }
    .assignment-card { border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; transition: 0.2s; background: var(--surface); display: flex; flex-direction: column; }
    .assignment-card:hover { border-color: var(--border-hover); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; }
    .subject-icon { font-size: 1.25rem; }
    .due-badge { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 600; border: 1px solid var(--border); }
    .due-badge.urgent { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.2); }
    .due-badge.soon { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: rgba(245, 158, 11, 0.2); }
    .due-badge.ok { background: rgba(34, 197, 94, 0.1); color: var(--success); border-color: rgba(34, 197, 94, 0.2); }
    .card-subject { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; letter-spacing: -0.01em; }
    .card-desc { font-size: 0.875rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.5rem; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 1rem; margin-top: auto; }
    .due-info { font-size: 0.75rem; color: var(--muted); }
    .due-info span { color: var(--text); font-weight: 500; }
    .btn-submit-card { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-submit-card:hover:not([disabled]) { background: var(--accent-hover); }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 1rem; color: var(--muted); font-family: var(--font-serif); font-size: 1.25rem; font-style: italic; }
    
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; position: relative; }
    .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; border: none; color: var(--muted); font-size: 1.25rem; cursor: pointer; transition: 0.2s; }
    .modal-close:hover { color: var(--text); }
    .modal h2 { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 500; margin-bottom: 1.25rem; }
    .modal-subject-tag { display: inline-block; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input, .form-group textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.875rem 1rem; border-radius: 4px; font-size: 0.875rem; font-family: var(--font-sans); transition: 0.2s; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { min-height: 80px; resize: vertical; }
    
    .drop-zone { border: 1px dashed var(--border); border-radius: 4px; padding: 2.5rem 1rem; text-align: center; cursor: pointer; transition: 0.2s; background: var(--bg); position: relative; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop-icon { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--muted); }
    .drop-text { font-size: 0.875rem; color: var(--text); font-weight: 500; }
    .drop-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
    
    .file-selected { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; margin-top: 0.75rem; background: var(--surface2); }
    .file-name { font-size: 0.8125rem; font-weight: 500; color: var(--text); }
    .file-size { font-size: 0.75rem; color: var(--muted); }
    
    .btn-primary { width: 100%; background: var(--accent); color: white; border: none; padding: 1rem; border-radius: 999px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
    .btn-primary:hover:not([disabled]) { background: var(--accent-hover); }
    
    .success-modal { text-align: center; padding: 2rem 0; }
    .success-icon { font-size: 3rem; color: var(--success); margin-bottom: 1rem; }
    
    /* TOAST */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.75rem 1.5rem; border-radius: 999px; font-size: 0.875rem; font-weight: 500; opacity: 0; transition: 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 2000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    
    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8125rem; border-top: 1px solid var(--border); }
    footer a { color: var(--text); font-weight: 500; text-decoration: none; }
    
    @media (max-width: 640px) {
      .stats-bar { flex-direction: column; }
      .modal { border-radius: 16px 16px 0 0; margin-top: auto; max-height: 95vh; }
      .modal-overlay { align-items: flex-end; padding: 0; }
    }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">EduSubmit</div>
    <a href="admin/index.html" class="btn-admin">Admin Portal</a>
  </nav>

  <section class="hero">
    <h1>Submit Your Assignments</h1>
    <p>Browse open assignments, upload your files, and you're done in seconds.</p>
  </section>

  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Open</div></div>
    <div class="stat"><div class="stat-num" id="stat-due-soon">0</div><div class="stat-label">Due Soon</div></div>
    <div class="stat"><div class="stat-num" id="stat-subjects">0</div><div class="stat-label">Subjects</div></div>
  </div>

  <section class="section" id="assignments">
    <div class="section-header">
      <h2 class="section-title">Open Assignments</h2>
      <div class="filter-tabs">
        <button class="tab active" onclick="filterCards('all',this)">All</button>
        <button class="tab" onclick="filterCards('urgent',this)">Urgent</button>
        <button class="tab" onclick="filterCards('soon',this)">Soon</button>
      </div>
    </div>
    <div id="assignments-grid">
      <div class="empty-state">Loading assignments…</div>
    </div>
  </section>

  <div class="modal-overlay" id="modal" onclick="closeModalOnOverlay(event)">
    <div class="modal" id="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>EduSubmit &copy; 2026 &middot; <a href="admin/index.html">Admin</a></footer>

  <script>
    let assignments = [], selectedAssignment = null;
    const ICONS = ['📚','📐','🔬','🌍','📝','🎨','🧮','💻','📖','🏛'];

    async function loadAssignments() {
      try {
        const res = await fetch('/.netlify/functions/get-assignments');
        const data = await res.json();
        assignments = data.assignments || [];
      } catch(e) { assignments = []; }
      renderCards(assignments); updateStats();
    }

    function getDueStatus(d) { const diff=(new Date(d)-new Date())/(1000*60*60*24); return diff<1?'urgent':diff<3?'soon':'ok'; }
    function formatDueDate(d) { return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
    function getDaysLeft(d) { const diff=Math.ceil((new Date(d)-new Date())/(1000*60*60*24)); if(diff<=0)return'⚠ Overdue'; if(diff===1)return'🔴 1 day left'; if(diff<=3)return`🟡 ${diff} days left`; return`🟢 ${diff} days left`; }

    function renderCards(list) {
      const grid = document.getElementById('assignments-grid');
      if (!list.length) { grid.innerHTML=`<div class="empty-state">No assignments right now</div>`; return; }
      const labels={urgent:'Due Today',soon:'Due Soon',ok:'On Track'};
      grid.innerHTML = list.map((a,i) => {
        const s=getDueStatus(a.dueDate);
        const pastDue=new Date(a.dueDate).getTime()<Date.now();
        const isClosed = a.isOpen===false || (pastDue && a.isOpen!==true);
        return `<div class="assignment-card">
          <div class="card-top"><div class="subject-icon">${ICONS[i%ICONS.length]}</div><div class="due-badge ${isClosed?'urgent':s}">${isClosed?'Closed':labels[s]}</div></div>
          <div class="card-subject">${escHtml(a.subject)}</div>
          <div class="card-desc">${escHtml(a.description||'Submit your assignment file.')}</div>
          <div class="card-footer">
            <div class="due-info">Due: <span>${formatDueDate(a.dueDate)}</span><br><small>${getDaysLeft(a.dueDate)}</small></div>
            ${isClosed
              ? `<button class="btn-submit-card" disabled style="opacity:0.4;cursor:not-allowed">Closed</button>`
              : `<button class="btn-submit-card" onclick="openSubmitModal('${a.id}')">Submit</button>`}
          </div>
        </div>`;
      }).join('');
    }

    function filterCards(type,btn) { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderCards(type==='all'?assignments:assignments.filter(a=>getDueStatus(a.dueDate)===type)); }
    function updateStats() { document.getElementById('stat-total').textContent=assignments.length; document.getElementById('stat-due-soon').textContent=assignments.filter(a=>['urgent','soon'].includes(getDueStatus(a.dueDate))).length; document.getElementById('stat-subjects').textContent=new Set(assignments.map(a=>a.subject)).size; }

    function openSubmitModal(id) {
      selectedAssignment=assignments.find(a=>a.id===id); if(!selectedAssignment)return;
      document.getElementById('modal-body').innerHTML=buildForm(selectedAssignment);
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow='hidden'; setupDropzone();
    }

    function buildForm(a) {
      return `<h2>Submit Assignment</h2>
        <div class="modal-subject-tag">${escHtml(a.subject)}</div>
        <div class="form-group"><label>Your Full Name (optional)</label><input type="text" id="student-name" placeholder="Enter your full name" autocomplete="name"></div>
        <div class="form-group"><label>Student ID / Roll No. (optional)</label><input type="text" id="student-id" placeholder="e.g. 2024-CS-045"></div>
        <div class="form-group"><label>Assignment File</label>
          <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input">
            <div class="drop-icon">📎</div>
            <div class="drop-text"><strong>Click or drag to upload</strong></div>
            <div class="drop-hint">Max 20MB</div>
          </div>
          <div id="file-info"></div>
        </div>
        <div class="form-group"><label>Note (optional)</label><textarea id="student-note" placeholder="Any comments…"></textarea></div>
        <button class="btn-primary" id="submit-btn" onclick="submitAssignment()"><span id="submit-label">Submit Assignment</span></button>`;
    }

    function setupDropzone() {
      const dz=document.getElementById('drop-zone'), fi=document.getElementById('file-input'); if(!dz||!fi)return;
      dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
      dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
      dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files[0])showFile(e.dataTransfer.files[0]);});
      fi.addEventListener('change',()=>{if(fi.files[0])showFile(fi.files[0]);});
    }

    function showFile(f) { const ext=f.name.split('.').pop().toLowerCase(); const iconMap={pdf:'📄',doc:'📝',docx:'📝',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',mp4:'🎬',mp3:'🎵',zip:'🗜️',txt:'📃',pptx:'📊',xlsx:'📊',csv:'📊'}; document.getElementById('file-info').innerHTML=`<div class="file-selected"><span class="file-icon">${iconMap[ext]||'📁'}</span><div><div class="file-name">${escHtml(f.name)}</div><div class="file-size">${(f.size/1024/1024).toFixed(2)} MB</div></div></div>`; }

    async function submitAssignment() {
      const name=document.getElementById('student-name')?.value.trim()||'';
      const sid=document.getElementById('student-id')?.value.trim()||'';
      const file=document.getElementById('file-input')?.files[0];
      const note=document.getElementById('student-note')?.value.trim();
      if(!file)return showToast('Please select a file.','error');
      const ext=file.name.split('.').pop().toLowerCase();

      if(file.size>20*1024*1024)return showToast('File too large. Max 20MB.','error');
      const btn=document.getElementById('submit-btn'); btn.disabled=true;
      document.getElementById('submit-label').innerHTML='<div class="spinner"></div>';
      const fd=new FormData(); fd.append('assignmentId',selectedAssignment.id); fd.append('subject',selectedAssignment.subject); fd.append('studentName',name); fd.append('studentId',sid); fd.append('note',note||''); fd.append('file',file);
      try {
        const res=await fetch('/.netlify/functions/submit-assignment',{method:'POST',body:fd});
        const data=await res.json();
        if(data.success) {
          document.getElementById('modal-body').innerHTML=`<div class="success-modal"><div class="success-icon">✓</div><h2>Submitted!</h2><p>Your assignment has been received.</p></div>`;
          setTimeout(()=>{closeModal();showToast('Assignment submitted!','success');},1800);
        } else throw new Error(data.error||'Submission failed');
      } catch(e) { btn.disabled=false; document.getElementById('submit-label').textContent='Submit Assignment'; showToast('Failed: '+e.message,'error'); }
    }

    function closeModal() { document.getElementById('modal').classList.remove('open'); document.body.style.overflow=''; selectedAssignment=null; }
    function closeModalOnOverlay(e) { if(e.target===document.getElementById('modal'))closeModal(); }
    function showToast(msg,type='success') { const t=document.getElementById('toast'); t.innerHTML=\`\${escHtml(msg)}\`; t.className=\`toast \${type} show\`; setTimeout(()=>t.className='toast',3500); }
    function escHtml(s) { return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    loadAssignments();
  </script>
</body>
</html>
